<style>
  :root { --bg:#000; --card:#121214; --card2:#1c1c1f; --text:#fff; --muted:#8e8e93; --line:#2c2c2e;

<script>

/* ---- render ---- */

  load(known, null);       // the server's current month; idx stays the snapshot's (a "nothing changed" answer keeps it, so edits have a month)
  flushOutbox();
  setTimeout(sendWaiting, 1500);                      // R2: after the first load has had its turn
  showAddHint();
  registerSW();
})();
</script>
